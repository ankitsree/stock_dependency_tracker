[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stock-dependency-tracker"
version = "0.1.0"
description = "Stock correlation dependency graph: anchor/satellite discovery, analysis, and a REST API."
requires-python = ">=3.9"
dependencies = [
    "yfinance>=0.2.40",
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "networkx>=3.0",
    "matplotlib>=3.7",
    "pyvis>=0.3.2",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "pyarrow>=14.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "eval_type_backport>=0.2.0",
]

[project.optional-dependencies]
test = ["pytest>=7.4", "httpx>=0.27"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

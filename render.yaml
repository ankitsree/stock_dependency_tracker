# Render Blueprint — infrastructure as code for the API service + database.
#
# Declaring the service here rather than clicking through the dashboard means
# the deployment config is reviewable, diffable, and reproducible. Render reads
# this file when you create/sync a Blueprint from the repo.
#
# STAGE 2 (this file now): API + a managed Postgres. src/api/deps.py switches
# to the Postgres repositories automatically once DATABASE_URL is set — no
# code change needed here.
#
# STAGE 3: .github/workflows/cd.yml now owns migrations and deploys (see
# `autoDeploy: false` below) — only the one-time universe backfill stays
# manual. See the comments below and production-roadmap.md §6/§7.
#
# NOTE: Render's blueprint schema changes over time (`env:` became `runtime:`,
# plan names have shifted). If `render.yaml` is rejected at Blueprint sync,
# check the current spec at https://render.com/docs/blueprint-spec — the intent
# of each key below is documented inline so it is easy to re-map.
#
# The frontend is NOT here. It deploys to Vercel as a static build
# (see frontend/vercel.json).

services:
  - type: web
    name: stockdep-api
    runtime: docker
    branch: main

    # Off on purpose. Render's own auto-deploy fires the instant it sees a
    # new commit on `branch`, with no way to make it wait for migrations to
    # finish first — that's a race against .github/workflows/cd.yml, which
    # runs `alembic upgrade head` before deploying. With autoDeploy off,
    # cd.yml is the only thing that triggers a deploy (via the Deploy Hook
    # below), so migrate-then-deploy ordering is guaranteed instead of hoped
    # for. A push still updates this service's *code*; it just doesn't go
    # live until cd.yml says so.
    autoDeploy: false

    # Must equal the database's region below — otherwise DATABASE_URL's
    # internal hostname won't resolve, or traffic leaves Render's network.
    region: oregon

    # `free` spins the service down after ~15 minutes idle. Before this
    # stage that meant every wake re-fetched the whole universe from Yahoo
    # (see the dedup fix in CorrelationService.prefetch_prices for the worst
    # of it); now cold starts read warm rows from Postgres instead, so `free`
    # is far less painful than in Stage 1 — but a spun-down free plan also
    # can't run `preDeployCommand` (see below), so migrations become a manual
    # step. `starter` removes both issues; upgrade if that manual step gets
    # old.
    plan: free

    dockerfilePath: ./Dockerfile
    dockerContext: .

    # Render probes this before routing traffic to a new deploy. Already
    # implemented (src/api/routers/health.py) and also used as the Dockerfile's
    # own HEALTHCHECK.
    healthCheckPath: /api/health

    # Left commented out — superseded by .github/workflows/cd.yml, which now
    # runs `alembic upgrade head` against DATABASE_URL before triggering the
    # deploy (see `autoDeploy: false` above), so this would just be a second,
    # redundant place migrations could run. It's also `free`-plan-incompatible
    # (Pre-Deploy Commands need a paid plan) and would block the blueprint
    # sync if uncommented while `plan: free`. Leave off even after upgrading
    # plans, to avoid two independent migration triggers racing each other.
    # preDeployCommand: alembic upgrade head

    envVars:
      - key: LOG_LEVEL
        value: INFO

      # `sync: false` means "don't take a value from this file — prompt me in
      # the dashboard." Correct here because the Vercel origin isn't known
      # until the frontend is deployed, and committing a placeholder would
      # silently block every browser request instead of failing loudly.
      # Set to the Vercel production URL, e.g. https://<project>.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        sync: false

      # `fromDatabase` injects the connection string at deploy time — it's
      # never typed into a dashboard field or committed here. Render's value
      # starts `postgresql://`; src/repositories/postgres/db.py rewrites
      # that to `postgresql+psycopg://` for SQLAlchemy, so no action needed.
      - key: DATABASE_URL
        fromDatabase:
          name: stockdep-db
          property: connectionString

      # `sync: false` — same reasoning as CORS_ALLOWED_ORIGINS above. Not a
      # traditional secret (Sentry DSNs are meant to be safe even in
      # client-side code) but still environment-specific, so it stays a
      # dashboard entry rather than a committed value. Unset => src/api/main.py
      # skips sentry_sdk.init() entirely.
      - key: SENTRY_DSN
        sync: false

    # Deliberately absent: PORT and a start command. Render injects PORT, and
    # the Dockerfile's CMD already binds ${PORT:-8000}.

databases:
  - name: stockdep-db
    plan: basic-256mb
    postgresMajorVersion: "16"
    region: oregon

# --- Manual steps after the first sync with this database block -----------
#
# Render creates empty `companies`/`prices` tables for you. Schema changes
# after that are handled by .github/workflows/cd.yml on every merge to main
# (build -> migrate -> deploy) — no dashboard step needed for that anymore.
#
# The one step that stays manual, and only runs once ever:
#   Seed the universe + price history:
#     python -m src.cli backfill-postgres
#   Run it locally against the database's External Database URL (Shell tab
#   is a paid-plan feature — see production-roadmap.md §6.1 for the
#   workaround). Safe to re-run; every write is an upsert (see src/cli.py).

# Render Blueprint — infrastructure as code for the API service + database.
#
# Declaring the service here rather than clicking through the dashboard means
# the deployment config is reviewable, diffable, and reproducible. Render reads
# this file when you create/sync a Blueprint from the repo.
#
# STAGE 2 (this file now): API + a managed Postgres. src/api/deps.py switches
# to the Postgres repositories automatically once DATABASE_URL is set — no
# code change needed here, only this file and two manual steps after deploy
# (migrate, backfill — see the comments below and production-roadmap.md §6).
#
# NOTE: Render's blueprint schema changes over time (`env:` became `runtime:`,
# plan names have shifted). If `render.yaml` is rejected at Blueprint sync,
# check the current spec at https://render.com/docs/blueprint-spec — the intent
# of each key below is documented inline so it is easy to re-map.
#
# The frontend is NOT here. It deploys to Vercel as a static build
# (see frontend/vercel.json).

services:
  - type: web
    name: stockdep-api
    runtime: docker
    branch: main
    autoDeploy: true

    # Must equal the database's region below — otherwise DATABASE_URL's
    # internal hostname won't resolve, or traffic leaves Render's network.
    region: oregon

    # `free` spins the service down after ~15 minutes idle. Before this
    # stage that meant every wake re-fetched the whole universe from Yahoo
    # (see the dedup fix in CorrelationService.prefetch_prices for the worst
    # of it); now cold starts read warm rows from Postgres instead, so `free`
    # is far less painful than in Stage 1 — but a spun-down free plan also
    # can't run `preDeployCommand` (see below), so migrations become a manual
    # step. `starter` removes both issues; upgrade if that manual step gets
    # old.
    plan: free

    dockerfilePath: ./Dockerfile
    dockerContext: .

    # Render probes this before routing traffic to a new deploy. Already
    # implemented (src/api/routers/health.py) and also used as the Dockerfile's
    # own HEALTHCHECK.
    healthCheckPath: /api/health

    # Runs `alembic upgrade head` before the new instance takes traffic —
    # the production equivalent of the `docker compose exec api alembic
    # upgrade head` step used locally. UNCOMMENT ONLY AFTER upgrading off
    # the `free` plan: Pre-Deploy Commands aren't available on it, and Render
    # will reject the blueprint sync with this present while `plan: free`.
    # Until then, run migrations manually — see the comment block below.
    # preDeployCommand: alembic upgrade head

    envVars:
      - key: LOG_LEVEL
        value: INFO

      # `sync: false` means "don't take a value from this file — prompt me in
      # the dashboard." Correct here because the Vercel origin isn't known
      # until the frontend is deployed, and committing a placeholder would
      # silently block every browser request instead of failing loudly.
      # Set to the Vercel production URL, e.g. https://<project>.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        sync: false

      # `fromDatabase` injects the connection string at deploy time — it's
      # never typed into a dashboard field or committed here. Render's value
      # starts `postgresql://`; src/repositories/postgres/db.py rewrites
      # that to `postgresql+psycopg://` for SQLAlchemy, so no action needed.
      - key: DATABASE_URL
        fromDatabase:
          name: stockdep-db
          property: connectionString

    # Deliberately absent: PORT and a start command. Render injects PORT, and
    # the Dockerfile's CMD already binds ${PORT:-8000}.

databases:
  - name: stockdep-db
    plan: basic-256mb
    postgresMajorVersion: "16"
    region: oregon

# --- Manual steps after the first sync with this database block -----------
#
# Render creates empty `companies`/`prices` tables for you — nothing runs
# `alembic upgrade head` automatically unless `preDeployCommand` is active
# (needs a paid web-service plan; see above). Until then, after each deploy
# that changes the schema:
#
#   1. Render dashboard -> stockdep-api -> Shell tab -> run:
#        alembic upgrade head
#      (One-off jobs also work: dashboard -> Jobs -> Run Job, same command,
#      same environment as the web service.)
#   2. First time only — seed the universe + price history:
#        python -m src.cli backfill-postgres
#      Safe to re-run; every write is an upsert (see src/cli.py).
#
# Once `preDeployCommand` is active, step 1 happens automatically on every
# deploy; step 2 still only needs to run once.

# Phase 1 used a single anchor; Phase 2 expands to multiple anchors plus
# rolling-correlation stability scoring. run_phase1.py only ever looks at
# anchors[0], so it keeps working unchanged.
anchors:
  - NVDA
  - AAPL
  - TSM
  - ASML

lookback_days: 365
top_n: 10
correlation_threshold: 0.5
rolling_window: 60

# Phase 4 — advanced analytics
market_proxy_ticker: "^GSPC"   # S&P 500 index, used to compute partial (market-adjusted) correlation
lag_max_days: 3                # time-lagged cross-correlation checks lag = 1..this many days
regime_recent_days: 30         # trailing window averaged for regime-break detection
regime_break_threshold: 0.35   # |full-period correlation - recent correlation| that counts as a regime break

# Phase 4.5 — REST API
price_cache_ttl_seconds: 21600   # 6h — how long a repository serves cached prices/metadata before treating them as stale
cors_allowed_origins:             # frontend dev origins allowed to call the API
  - "http://localhost:3000"
  - "http://localhost:5173"

data_dir: data
outputs_dir: outputs

# CI (production-roadmap.md §7): every PR and every push to main gets
# linted, type-checked, and tested against a real Postgres — not just the
# yfinance-backed repositories. `test` and `build` exercise the same
# Dockerfile/Makefile targets a human would run locally, so a green run here
# means `make check` and `docker build` would also be green on your machine.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev,test]"
      - run: make lint-check
      - run: make format-check
      - run: make typecheck

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: stockdep_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      # Same DSN the postgres service above accepts connections on. Present
      # in the environment for both the migration step and pytest — the
      # Postgres repository tests (tests/repositories/postgres/) skip
      # themselves when unreachable, but here they should run for real.
      DATABASE_URL: postgresql://app:app@localhost:5432/stockdep_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev,test]"
      - name: Apply migrations
        run: alembic upgrade head
      - run: make test

  frontend:
    # Vercel deploys the frontend on merge regardless of whether these tests
    # pass — this job is what actually gates them. Unit tests only (Vitest);
    # Playwright e2e needs the backend running, so it stays out of CI for now.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  build:
    # Confirms the production image still builds. No push here — cd.yml
    # builds and pushes the real deploy artifact on merge, so doing it again
    # here would just be redundant work on every push to main.
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false

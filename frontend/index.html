<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Stock Dependency Tracker</title>
    <script>
      // Resolve and apply the theme BEFORE first paint so there is no flash of
      // the wrong theme. Mirrors ThemeProvider's resolution order:
      // stored choice -> OS preference -> light (the default). The storage key
      // and data-theme attribute must match ThemeProvider.tsx.
      (function () {
        try {
          var stored = localStorage.getItem('sdt-theme')
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.dataset.theme = theme
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
